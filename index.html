<script>
(function () {
  'use strict';

  const NATIVE = {
    fetch:        window.fetch,
    toString:     Function.prototype.toString,
    xhrOpen:      window.XMLHttpRequest && window.XMLHttpRequest.prototype.open,
    xhrSend:      window.XMLHttpRequest && window.XMLHttpRequest.prototype.send,
    defineProp:   Object.defineProperty,
    freeze:       Object.freeze,
    locReplace:   window.location.replace.bind(window.location)
  };

  let killed = false;

  function hardKill(reason) {
    if (killed) return;
    killed = true;
    try { localStorage.clear(); } catch {}
    try { sessionStorage.clear(); } catch {}
    try {
      document.cookie.split(';').forEach(c => {
        const n = c.split('=')[0].trim();
        document.cookie = n + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
      });
    } catch {}
    try { NATIVE.locReplace('about:blank'); } catch {
      try { window.location.href = 'about:blank'; } catch {}
    }
  }
  window.__guardKill = hardKill;

  // ---------- 1. console vira no-op ----------
  try {
    const _noop = function () {};
    const methods = [
      'log','info','warn','error','debug','trace','dir','dirxml','table',
      'group','groupCollapsed','groupEnd','count','countReset','assert',
      'clear','time','timeEnd','timeLog','profile','profileEnd','timeStamp'
    ];
    for (const m of methods) {
      try {
        NATIVE.defineProp(console, m, {
          value: _noop, writable: false, configurable: false, enumerable: false
        });
      } catch {}
    }
    try { NATIVE.freeze(console); } catch {}
  } catch {}

  // ---------- 2. congela só o que não quebra o Google ----------
  // NÃO congelar setTimeout/setInterval: o GSI usa intensivamente.
  // NÃO congelar fetch: o GSI tbm usa; em vez disso, checamos integridade.

  try {
    NATIVE.defineProp(Function.prototype, 'toString', {
      value: NATIVE.toString, writable: false, configurable: false
    });
  } catch {}

  try {
    if (window.XMLHttpRequest) {
      NATIVE.defineProp(window.XMLHttpRequest.prototype, 'open', {
        value: NATIVE.xhrOpen, writable: false, configurable: false
      });
      NATIVE.defineProp(window.XMLHttpRequest.prototype, 'send', {
        value: NATIVE.xhrSend, writable: false, configurable: false
      });
    }
  } catch {}

  // ---------- 3. integridade ----------
  function isNative(fn) {
    if (typeof fn !== 'function') return false;
    try { return NATIVE.toString.call(fn).indexOf('[native code]') !== -1; }
    catch { return false; }
  }

  function checkIntegrity() {
    if (killed) return;

    if (window.fetch !== NATIVE.fetch) return hardKill('fetch_replaced');
    if (!isNative(window.fetch))       return hardKill('fetch_not_native');

    if (Function.prototype.toString !== NATIVE.toString) return hardKill('fptostring_replaced');
    if (!isNative(Function.prototype.toString))          return hardKill('fptostring_not_native');

    if (window.XMLHttpRequest) {
      if (!isNative(window.XMLHttpRequest.prototype.open)) return hardKill('xhr_open_patched');
      if (!isNative(window.XMLHttpRequest.prototype.send)) return hardKill('xhr_send_patched');
    }

    if (Object.defineProperty !== NATIVE.defineProp) return hardKill('defineprop_replaced');
    if (Object.freeze !== NATIVE.freeze)             return hardKill('freeze_replaced');

    // userscript managers
    const gm = [
      'unsafeWindow','GM_info','GM','GM_setValue','GM_getValue','GM_deleteValue',
      'GM_listValues','GM_xmlhttpRequest','GM_addStyle','GM_registerMenuCommand',
      'GM_notification','GM_openInTab','GM_setClipboard','GM_download',
      'GM_getResourceText','GM_addElement','VM','VM_info'
    ];
    for (const g of gm) if (g in window) return hardKill('userscript_global:' + g);

    // DevTools ancorado (dimensão) — threshold generoso pra evitar falso positivo
    if (devtoolsOpen()) return hardKill('devtools_open');
  }

  function devtoolsOpen() {
    try {
      // janela real vs viewport. Barra de favoritos + status bar ocupam
      // ~130px no pior caso. DevTools ancorado abre >220px de um lado.
      const wDiff = window.outerWidth  - window.innerWidth;
      const hDiff = window.outerHeight - window.innerHeight;
      return wDiff > 220 || hDiff > 220;
    } catch { return false; }
  }

  // ---------- 4. atalhos ----------
  function swallow(e) {
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    return false;
  }

  function blockShortcuts(e) {
    const k = (e.key || '').toLowerCase();
    if (k === 'f12') return swallow(e);
    if (e.ctrlKey && e.shiftKey && ['i','j','c','k','e','m','p'].includes(k)) return swallow(e);
    if (e.ctrlKey && !e.shiftKey && ['u','s','p'].includes(k)) return swallow(e);
  }

  window.addEventListener('keydown', blockShortcuts, true);
  window.addEventListener('keyup',   blockShortcuts, true);

  // clique direito: por padrão liberado (não atrapalha copiar texto).
  // pra bloquear, descomenta:
  // window.addEventListener('contextmenu', swallow, true);

  // ---------- 5. loop ----------
  const intervalId = setInterval(checkIntegrity, 900);
  window.addEventListener('resize', checkIntegrity);
  window.addEventListener('focus',  checkIntegrity);
  document.addEventListener('visibilitychange', checkIntegrity);

  try { checkIntegrity(); } catch {}
})();
</script>

    const r = await window.fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jwt })
    });

    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      sessionStorage.removeItem(SESSION_KEY);
      loginErr.textContent = err.error === 'no_authorized_block'
        ? 'sua conta não tem nenhum bloco autorizado.'
        : 'sem acesso.';
      kill();
      return;
    }

    const data = await r.json();
    who.textContent = data.name;
    grid.innerHTML = '';
    (data.blocks || []).forEach(b => grid.appendChild(renderBlock(b)));
    viewLogin.classList.add('hidden');
    viewSite.classList.remove('hidden');
  }

  function renderBlock(b) {
    const el = document.createElement('article');
    el.className = 'card' + (b.tag === 'Ingles' ? ' gold' : '');
    payloads.set(b.tag, b.payload || '');
    const feats = (b.features || []).map(f => `
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>${escapeHtml(f)}</li>`).join('');
    el.innerHTML = `
      <div class="kicker">${escapeHtml(b.kicker || 'a gente faz')}</div>
      <h2><em>${escapeHtml(b.tag)}</em></h2>
      <div class="role">${escapeHtml(b.sub || '')}</div>
      <ul class="features">${feats}</ul>
      <button class="cta">quero <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    `;
    return el;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- popup ----------
  function openExec(name) {
    execEmail.textContent = name || '—';
    execRunning.classList.remove('hidden');
    execDone.classList.add('hidden');
    execClose.classList.add('hidden');
    execOverlay.classList.remove('hidden');
  }
  function finishExec() {
    execRunning.classList.add('hidden');
    execDone.classList.remove('hidden');
    execClose.classList.remove('hidden');
  }
  function closeExec() { execOverlay.classList.add('hidden'); }

  async function copyToClipboard(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch {}
      document.body.removeChild(ta);
      return ok;
    }
  }

  grid.addEventListener('click', async (e) => {
    const btn = e.target.closest('.cta');
    if (!btn) return;
    const card = btn.closest('.card');
    const tag  = card?.querySelector('h2 em')?.textContent || '';
    const payload = payloads.get(tag) || '';
    openExec(tag);
    const ok = await copyToClipboard(payload);
    await new Promise(r => setTimeout(r, 1400));
    finishExec();
    if (!ok) {
      execDone.querySelector('.exec-sub').textContent =
        'não deu pra copiar automaticamente. selecione o texto manualmente.';
    }
  });

  execClose.addEventListener('click', closeExec);
  execOverlay.addEventListener('click', (e) => {
    if (e.target === execOverlay) closeExec();
  });

  function kill() {
    try { window.__guardKill && window.__guardKill('app_kill'); }
    catch { try { location.replace('about:blank'); } catch {} }
  }

  document.getElementById('btn-logout').addEventListener('click', () => {
    sessionStorage.removeItem(SESSION_KEY);
    try { if (window.google?.accounts?.id) google.accounts.id.disableAutoSelect(); } catch {}
    kill();
  });

  tryRestore();
})();
</script>
</body>
</html>

name: Decrypt, Obfuscate and Build

on:
  push:
    branches:
      - main
    paths:
      - '*.enc'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tools
        run: npm install -g javascript-obfuscator html-minifier-terser clean-css-cli terser

      - name: Decrypt and Obfuscate
        run: |
          mkdir -p temp_decrypted
          
          for file in *.enc; do
            if [ -f "$file" ]; then
              original="${file%.enc}"
              openssl enc -d -aes-256-cbc -pbkdf2 -in "$file" -out "temp_decrypted/$original" -k "${{ secrets.AES_KEY }}"
            fi
          done

          for file in temp_decrypted/*.html; do
            [ -f "$file" ] || continue
            html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true "$file" -o "$(basename "$file")"
          done

          for file in temp_decrypted/*.css; do
            [ -f "$file" ] || continue
            cleancss -o "$(basename "$file")" "$file"
          done

          for file in temp_decrypted/*.js; do
            [ -f "$file" ] || continue
            javascript-obfuscator "$file" --output "$(basename "$file")" \
              --compact true \
              --control-flow-flattening true \
              --dead-code-injection true \
              --string-array true \
              --string-array-rotate true \
              --string-array-shuffle true \
              --self-defending true \
              --disable-console-output true
          done

          rm -f *.enc
          rm -rf temp_decrypted

      - name: Commit and Push to Main
        run: |
          git config --global user.name 'Gabriel Augusto dos Santos'
          git config user.email 'gabriel@frostedge.com'
          
          git add -A
          git commit -m "R2FicmllbCBBdWd1c3RvIGRvcyBTYW50b3M4PR2FicmllbCBBdWd1c3RvIGRvcyBTYW50b3M4PR2FicmllbCBBdWd1c3RvIGRvcyBTYW50b3M4PR2FicmllbCBBdWd1c3RvIGRvcyBTYW50b3M4PR2FicmllbCBBdWd1c3RvIGRvcyBTYW50b3M4P" || echo "Sem mudanças"
          git push
